[package]
name = "re-trace"
version = "0.1.0"
description = "Re-Trace Desktop — language-agnostic execution trace player"
authors = ["Re-Trace"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
