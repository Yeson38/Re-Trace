<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re-Trace Player</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Phase 4: Top bar (file ops + language + record) -->
    <div id="topBar" class="rt-topbar"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">Re-Trace</span>
        <span class="brand-sub" id="sourceName">—</span>
        <span id="cpxHost" class="cpx-host"></span>
      </div>
      <div class="topbar-right">
        <span id="markChips" class="mark-chips"></span>
        <div class="counters">
          <span class="counter"><em>Step</em><b id="stepCounter">0 / 0</b></span>
          <span class="counter"><em>Global</em><b id="globalStep">0</b></span>
          <span class="counter"><em>Depth</em><b id="depthCounter">0</b></span>
        </div>
        <div id="searchBar" class="searchbar-host"></div>
      </div>
    </header>

    <main class="stage">
      <section class="pane pane-code" aria-label="Source code">
        <div class="pane-title" id="editorHeader">Source</div>
        <!-- Phase 4: Monaco editor replaces read-only CodeView -->
        <div class="code-scroll" id="editorHost" style="height:100%;"></div>
        <!-- Phase 0-3: CodeView fallback (hidden, kept for compat) -->
        <div class="code-scroll" id="code" style="display:none;"></div>
      </section>

      <section class="pane pane-inspector" aria-label="Inspector">
        <div class="inspector-tabs" role="tablist">
          <button class="inspector-tab active" role="tab" data-tab="vars">Variables</button>
          <button class="inspector-tab" role="tab" data-tab="loops">Loops</button>
          <button class="inspector-tab" role="tab" data-tab="terminal">Output</button>
        </div>
        <div class="pane-block active" data-pane="vars">
          <div class="pane-title">Variables</div>
          <div class="tree" id="vars"></div>
        </div>
        <div class="pane-block" data-pane="loops">
          <div class="pane-title">Loops</div>
          <div class="loops" id="loops"></div>
        </div>
        <div class="pane-block pane-terminal" data-pane="terminal">
          <div class="pane-title">Output</div>
          <pre class="terminal" id="terminal" aria-live="polite"></pre>
        </div>
      </section>
    </main>

    <footer class="transport" id="controls"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
